<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kung Tua Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed 3D arena canvas. Select screen = big character art left/right, roster strip at the bottom, 3D preview in the middle.
   Fight = arcade HUD top (HP, SUPER gauge, status chips), move pads bottom. Single dark look by choice. */
:root{
  --bg:#030305;
  --ink:#f4f1e8;
  --dim:#8d93a3;
  --p1:#ffd23d;
  --p2:#ff4d6d;
  --hp:#ffd23d;
  --hurt:#ff3b2f;
  --panel:rgba(10,12,18,.76);
  --line:rgba(255,255,255,.16);
  --display:"Bungee","Chakra Petch",Impact,sans-serif;
  --body:"Chakra Petch","Kanit",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--p1);outline-offset:2px}

/* ---------- character select ---------- */
.select{position:fixed;inset:0;pointer-events:none;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"head head head" "a1 mid a2" "roster roster roster" "act act act";
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px);
  background:
    linear-gradient(90deg,rgba(3,3,5,.94) 0%,rgba(3,3,5,.35) 30%,rgba(3,3,5,0) 42%,rgba(3,3,5,0) 58%,rgba(3,3,5,.35) 70%,rgba(3,3,5,.94) 100%),
    linear-gradient(0deg,rgba(3,3,5,.95) 0%,rgba(3,3,5,0) 34%);
  gap:10px}
.sel-head{grid-area:head;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.sel-title{font-family:var(--display);font-size:clamp(20px,3.4vw,34px);letter-spacing:.06em;text-shadow:0 0 18px rgba(255,210,61,.45),3px 3px 0 #000}
.sel-hint{font-weight:600;font-size:14px;color:var(--dim)}
.sel-hint b{color:var(--ink)}
.sel-art{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;min-height:0}
.sel-art.a{grid-area:a1;align-items:flex-start}
.sel-art.b{grid-area:a2;align-items:flex-end;text-align:right}
.sel-art img{width:100%;max-width:520px;max-height:100%;min-height:0;flex:1 1 auto;object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 0 22px var(--c)) drop-shadow(0 10px 30px rgba(0,0,0,.8));transition:filter .3s}
.sel-art.a img{transform:scaleX(-1);object-position:bottom right}
.sel-art.b img{object-position:bottom left}
.sel-art img.swap{animation:artIn .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes artIn{from{opacity:.2;translate:var(--from) 0}to{opacity:1;translate:0 0}}
.sel-art.a{--from:-40px}.sel-art.b{--from:40px}
.sel-name{font-family:var(--display);font-size:clamp(26px,4.6vw,58px);line-height:.95;color:var(--c);font-style:italic;
  -webkit-text-stroke:2px #000;text-shadow:0 0 24px var(--c),5px 5px 0 #000;transform:skewX(-8deg);margin-top:-8px}
.sel-th{font-weight:700;font-size:14px;color:var(--ink);opacity:.9;margin-top:6px}
.sel-role{font-weight:600;font-size:12px;color:var(--dim);margin-top:3px;max-width:38ch}
.sel-ult{font-family:var(--display);font-size:12px;color:var(--c);margin-top:4px;letter-spacing:.03em}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 10px;margin-top:8px;font-size:12px;font-weight:700;color:var(--dim);align-items:center}
.sel-art.b .stats{justify-content:end}
.pips{display:flex;gap:3px}
.pips i{width:16px;height:8px;background:rgba(255,255,255,.12);transform:skewX(-20deg)}
.pips i.on{background:var(--c);box-shadow:0 0 6px var(--c)}
.tag{position:absolute;top:0;font-family:var(--display);font-size:22px;padding:4px 10px;color:#000;background:var(--pc)}
.sel-art.a .tag{left:0;--pc:var(--p1)}
.sel-art.b .tag{right:0;--pc:var(--p2)}
.ready{position:absolute;top:30%;font-family:var(--display);font-size:clamp(28px,4vw,46px);color:var(--pc);-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 #000;transform:rotate(-8deg);animation:stamp .3s cubic-bezier(.2,1.6,.4,1)}
.sel-art.a .ready{left:12%;--pc:var(--p1)} .sel-art.b .ready{right:12%;--pc:var(--p2)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.roster{grid-area:roster;display:flex;justify-content:center;gap:8px;pointer-events:auto;flex-wrap:wrap}
.tile{position:relative;width:96px;aspect-ratio:1;max-width:100%;padding:0;border:0;background:linear-gradient(160deg,var(--c) -60%,#0b0d14 70%);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);overflow:hidden;transition:transform .12s}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 18%;transform:scale(1.7);transform-origin:30% 20%;filter:saturate(.8) brightness(.85);transition:filter .15s}
.tile::after{content:"";position:absolute;inset:0;border:3px solid transparent;clip-path:inherit;pointer-events:none}
.tile.p1::after{border-color:var(--p1)}
.tile.p2::after{border-color:var(--p2)}
.tile.p1.p2::after{border-color:var(--p1) var(--p2) var(--p2) var(--p1)}
.tile.p1 img,.tile.p2 img,.tile:hover img{filter:none}
.tile:hover{transform:translateY(-3px)}
.tile .who{position:absolute;bottom:2px;font-family:var(--display);font-size:13px;padding:0 6px;color:#000}
.tile .who.w1{left:8px;background:var(--p1)} .tile .who.w2{right:8px;background:var(--p2)}
.tile.rand{display:grid;place-items:center;font-family:var(--display);font-size:42px;color:var(--ink);--c:#666}
.sel-act{grid-area:act;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;pointer-events:auto}
.tog{font-weight:700;font-size:13px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);border-radius:999px}
.tog[aria-pressed="true"]{border-color:var(--p1);color:var(--p1)}
.tog.hot{border-color:var(--p1);background:var(--p1);color:#000}

/* ---------- VS splash ---------- */
.vs{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:#000}
.vs .half{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.vs .half.a{background:linear-gradient(120deg,var(--c) -80%,#050508 65%);animation:inL .45s cubic-bezier(.2,1,.3,1)}
.vs .half.b{background:linear-gradient(240deg,var(--c) -80%,#050508 65%);animation:inR .45s cubic-bezier(.2,1,.3,1)}
.vs img{width:92%;max-height:72vh;object-fit:contain;filter:drop-shadow(0 0 30px var(--c))}
.vs .half.a img{transform:scaleX(-1)}
.vs .vn{position:absolute;bottom:12%;font-family:var(--display);font-size:clamp(22px,4vw,48px);color:var(--c);-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 #000;font-style:italic}
.vs .vtext{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(80px,18vw,220px);color:#fff;
  -webkit-text-stroke:4px #000;text-shadow:0 0 50px rgba(255,210,61,.9),8px 8px 0 #000;animation:vsIn .6s .25s both cubic-bezier(.2,1.6,.4,1)}
@keyframes inL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes vsIn{from{transform:translate(-50%,-50%) scale(3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* ---------- ultimate cut-in ---------- */
.cine{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,0) 22%,rgba(0,0,0,.8) 72%);animation:fadeIn .15s}
.cine .band{position:absolute;left:-5%;right:-5%;top:64%;transform:skewY(-5deg);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 85%,#000) 12%,color-mix(in srgb,var(--c) 85%,#000) 88%,transparent);
  padding-block:10px;text-align:center;animation:bandIn .35s cubic-bezier(.2,1.4,.4,1)}
.cine .un{font-family:var(--display);font-size:clamp(28px,6.5vw,76px);line-height:1;color:#fff;-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 #000;font-style:italic}
.cine .ut{font-weight:700;font-size:clamp(13px,2vw,18px);color:#000;margin-top:4px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bandIn{from{transform:skewY(-5deg) translateX(-60%);opacity:0}to{transform:skewY(-5deg);opacity:1}}

/* ---------- fight HUD ---------- */
.hud{position:fixed;top:0;left:0;right:0;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.pl{display:flex;flex-direction:column;gap:6px;min-width:0}
.pl.b{align-items:flex-end;text-align:right}
.name{font-family:var(--display);font-size:clamp(13px,2.2vw,18px);letter-spacing:.04em;line-height:1;color:var(--c);text-shadow:0 0 12px var(--c)}
.name small{display:block;font-family:var(--body);font-weight:600;font-size:12px;color:var(--dim);letter-spacing:.02em;margin-top:4px;text-shadow:none}
.bar{position:relative;width:100%;height:20px;border:2px solid rgba(255,255,255,.88);background:#240807;transform:skewX(-16deg);overflow:hidden;box-shadow:0 0 0 2px #000,0 4px 18px rgba(0,0,0,.6)}
.pl.b .bar{transform:skewX(16deg) scaleX(-1)}
.bar b,.bar i{position:absolute;top:0;bottom:0;left:0;width:100%}
.bar b{background:var(--hurt);transition:width .55s ease .35s}
.bar i{background:linear-gradient(180deg,#fff2a8 0%,var(--hp) 45%,#e09a00 100%);transition:width .12s linear}
.bar.low i{background:linear-gradient(180deg,#ffb3a8,#ff5a3c 50%,#b8200f)}
.suprow{display:flex;gap:8px;align-items:center;width:72%}
.pl.b .suprow{flex-direction:row-reverse}
.suplab{font-family:var(--display);font-size:11px;color:var(--dim);letter-spacing:.04em}
.sup{position:relative;flex:1;height:10px;border:1.5px solid rgba(255,255,255,.7);background:#0c0f1a;transform:skewX(-16deg);overflow:hidden}
.pl.b .sup{transform:skewX(16deg) scaleX(-1)}
.sup i{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,#2f6bff,#9fd4ff)}
.suprow.full .sup i{background:linear-gradient(90deg,#ffb400,#fff3b0);animation:pulse .5s infinite alternate}
.suprow.full .suplab{color:var(--p1)}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
.chips{display:flex;gap:4px;flex-wrap:wrap;min-height:16px}
.pl.b .chips{justify-content:flex-end}
.chip{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;color:#000;letter-spacing:.03em}
.chip.buff{background:#7dffd8}.chip.shield{background:#bdf3ff}.chip.burn{background:#ff8a2a}.chip.slow{background:#b99bff}
.timer{font-family:var(--display);font-size:clamp(30px,5vw,46px);line-height:1;min-width:2.2ch;text-align:center;padding:4px 8px 6px;
  border:2px solid rgba(255,255,255,.88);background:var(--panel);font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px #000}
.combo{font-family:var(--display);font-size:clamp(16px,2.6vw,24px);font-style:italic;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;
  -webkit-text-stroke:1px #000;text-shadow:3px 3px 0 #000;color:var(--c)}
.combo.on{opacity:1;transform:none}
.announce{position:fixed;left:0;right:0;top:40%;transform:translateY(-50%);text-align:center;pointer-events:none;
  font-family:var(--display);font-size:clamp(52px,13vw,148px);line-height:1;color:#fff;opacity:0;
  -webkit-text-stroke:3px #000;text-shadow:0 0 30px rgba(255,210,61,.8),6px 6px 0 #000}
.announce.show{animation:slam 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
.announce.stay{animation:slamStay .6s cubic-bezier(.2,1.4,.4,1) forwards;font-size:clamp(30px,7vw,84px)}
.announce.ko{color:var(--hurt);text-shadow:0 0 40px rgba(255,59,47,.9),6px 6px 0 #000}
@keyframes slam{0%{opacity:0;transform:translateY(-50%) scale(2.4)}22%{opacity:1;transform:translateY(-50%) scale(1)}75%{opacity:1;transform:translateY(-50%) scale(1.04)}100%{opacity:0;transform:translateY(-50%) scale(1.12)}}
@keyframes slamStay{0%{opacity:0;transform:translateY(-50%) scale(2.2)}100%{opacity:1;transform:translateY(-50%) scale(1)}}
.controls{position:fixed;left:0;right:0;bottom:0;pointer-events:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"p1 mid p2";gap:12px;align-items:end}
.pad{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.pad.a{grid-area:p1}.pad.b{grid-area:p2;justify-content:flex-end}
.mid{grid-area:mid;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto}
.mid .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hint{font-size:12px;color:var(--dim);text-align:center}
.move{font-family:var(--display);font-size:13px;letter-spacing:.03em;padding:10px 12px 9px;background:var(--panel);
  border:1.5px solid var(--c);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px;transition:transform .08s,background .12s,opacity .2s}
.move span{font-family:var(--body);font-weight:700;font-size:12px;white-space:nowrap}
.move kbd{font-family:var(--body);font-size:10px;color:var(--dim)}
.move:active,.move.hit{transform:scale(.94);background:var(--c);color:#000}
.move:active kbd,.move.hit kbd{color:#000}
.move.sp{border-width:2px}
.move.ult{--c:#ffd23d;opacity:.4}
.move.ult.ready{opacity:1;background:color-mix(in srgb,#ffd23d 28%,var(--panel));animation:pulse .45s infinite alternate}

@media (max-width:700px){
  .select{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"head head" "a1 a2" "roster roster" "act act";
    background:linear-gradient(0deg,rgba(3,3,5,.96) 0%,rgba(3,3,5,.55) 40%,rgba(3,3,5,.3) 100%)}
  .sel-name{font-size:clamp(18px,6vw,28px);-webkit-text-stroke:1px #000}
  .sel-th{font-size:11px}.sel-role{font-size:10px}.sel-ult{font-size:10px}
  .stats{font-size:10px}.pips i{width:10px;height:6px}
  .tile{width:62px}
  .tag{font-size:15px}
  .controls{grid-template-columns:1fr 1fr;grid-template-areas:"mid mid" "p1 p2";gap:10px}
  .move{min-width:0;padding:8px 6px 7px;font-size:10px;flex:1 1 40%}
  .move span{font-size:11px}.move kbd{display:none}
  .hint{display:none}
  .name small{font-size:11px}.bar{height:16px}
  .suprow{width:100%}
}
</style>
</head>
<body>


<canvas id="stage" aria-label="สนามต่อสู้ 3 มิติของกุ้งตั้ว ลากเพื่อหมุนกล้องรอบตัวละคร"></canvas>

<section class="select gut" id="select" aria-label="หน้าเลือกตัวละคร">
  <header class="sel-head">
    <div class="sel-title">CHARACTER SELECT</div>
    <div class="sel-hint" id="selHint"></div>
  </header>
  <div class="sel-art a" id="artA"><span class="tag">1P</span><img id="art1" alt=""><div class="sel-name" id="sname1"></div><div class="sel-th" id="sth1"></div><div class="sel-role" id="srole1"></div><div class="sel-ult" id="sult1"></div><div class="stats" id="stats1"></div></div>
  <div class="sel-art b" id="artB"><span class="tag">2P</span><img id="art2" alt=""><div class="sel-name" id="sname2"></div><div class="sel-th" id="sth2"></div><div class="sel-role" id="srole2"></div><div class="sel-ult" id="sult2"></div><div class="stats" id="stats2"></div></div>
  <div class="roster" id="roster" role="listbox" aria-label="รายชื่อตัวละคร"></div>
  <div class="sel-act">
    <button class="tog" id="btnCpu" aria-pressed="true">2P: คอมพิวเตอร์</button>
    <button class="tog" id="btnBack">ยกเลิกตัวเลือกล่าสุด</button>
  </div>
</section>

<div class="vs" id="vs" hidden>
  <div class="half a" id="vsA"><img id="vsImg1" alt=""><div class="vn" id="vsN1"></div></div>
  <div class="half b" id="vsB"><img id="vsImg2" alt=""><div class="vn" id="vsN2"></div></div>
  <div class="vtext">VS</div>
</div>

<div class="cine" id="cine" hidden><div class="band"><div class="un" id="cineName"></div><div class="ut" id="cineTh"></div></div></div>

<div class="hud gut" id="hud" hidden>
  <div class="pl a" id="plA">
    <div class="name" id="name1"></div>
    <div class="bar" id="bar1"><b id="dmg1"></b><i id="hp1"></i></div>
    <div class="suprow" id="suprow1"><span class="suplab">SUPER</span><div class="sup"><i id="sup1"></i></div></div>
    <div class="chips" id="chips1"></div>
    <div class="combo" id="combo1"></div>
  </div>
  <div class="timer" id="timer">99</div>
  <div class="pl b" id="plB">
    <div class="name" id="name2"></div>
    <div class="bar" id="bar2"><b id="dmg2"></b><i id="hp2"></i></div>
    <div class="suprow" id="suprow2"><span class="suplab">SUPER</span><div class="sup"><i id="sup2"></i></div></div>
    <div class="chips" id="chips2"></div>
    <div class="combo" id="combo2"></div>
  </div>
</div>
<div class="announce" id="announce" aria-live="polite"></div>
<div class="controls gut" id="controls" hidden>
  <div class="pad a" id="padA" aria-label="ปุ่มผู้เล่น 1">
    <button class="move" id="p1-punch" data-p="0" data-m="punch"><span>หมัด</span>PUNCH<kbd>A</kbd></button>
    <button class="move" id="p1-tail" data-p="0" data-m="tail"><span>ฟาดหาง</span>TAIL<kbd>S</kbd></button>
    <button class="move sp" id="p1-special" data-p="0" data-m="special"><span id="spl1">พิเศษ</span>SKILL<kbd>D</kbd></button>
    <button class="move ult" id="p1-ult" data-p="0" data-m="ult"><span>ท่าไม้ตาย</span>ULTI<kbd>F</kbd></button>
  </div>
  <div class="mid">
    <div class="row">
      <button class="tog" id="tog-rotate" aria-pressed="true">หมุน 360°</button>
      <button class="tog" id="tog-auto" aria-pressed="false">ออโต้ไฟต์</button>
      <button class="tog" id="btn-rematch">รีแมตช์</button>
      <button class="tog" id="btn-select">เลือกตัวละคร</button>
    </div>
    <div class="hint">เกจ SUPER เต็มแล้วกด ULTI · ลากเพื่อหมุนกล้อง</div>
  </div>
  <div class="pad b" id="padB" aria-label="ปุ่มผู้เล่น 2">
    <button class="move" id="p2-punch" data-p="1" data-m="punch"><span>หมัด</span>PUNCH<kbd>J</kbd></button>
    <button class="move" id="p2-tail" data-p="1" data-m="tail"><span>ฟาดหาง</span>TAIL<kbd>K</kbd></button>
    <button class="move sp" id="p2-special" data-p="1" data-m="special"><span id="spl2">พิเศษ</span>SKILL<kbd>L</kbd></button>
    <button class="move ult" id="p2-ult" data-p="1" data-m="ult"><span>ท่าไม้ตาย</span>ULTI<kbd>;</kbd></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){const z=p.getZ(i);if(z>.12)p.setY(i,p.getY(i)+.42*(z-.12)*(z-.12));}

  if(P[slot]&&P[slot].id===id)return;
  if(P[slot])disposeFighter(P[slot]);
  P[slot]=makeFighter(CHARS[id],SLOTS[slot]);P[slot].idx=slot;
  if(P[0]&&P[1]){P[0].opp=P[1];P[1].opp=P[0];}
}

function burst(pos,color,n,speed,size){

/* ---------- game state ---------- */
let mode='select',started=false,over=false,timer=99,timerAcc=0,shake=0,slowmo=1,slowT=0,auto=false,matchToken=0,cine=null,camFocus=null,zoomK=0;
const BASE={punch:{dur:.42,dmg:8},tail:{dur:.75,dmg:11}};
function intro(){const tok=++matchToken;started=false;
  setTimeout(()=>{if(tok===matchToken)announce('ROUND 1');},350);
  setTimeout(()=>{if(tok===matchToken)announce('FIGHT!');},1550);
  setTimeout(()=>{if(tok===matchToken)started=true;},1900);}
function act(f,m){
  if(mode!=='fight'||over||!started||cine||f.state!=='idle')return;
  if(m==='ult'){if(f.sup<100)return;f.sup=0;f.state='ultcharge';f.t=0;startCine(f);return;}
  if(m==='special'&&f.cool>0)return;
  f.state=m;f.t=0;f.hitDone=false;f.hits=0;
  f.dur=(m==='special'?SPDUR[f.id]:(m==='punch'&&f.id==='thunder'?.62:BASE[m].dur))*f.durMul;
  if(m==='special')f.cool=f.spCool||2.4;
  const btn=$('p'+(f.idx+1)+'-'+m);if(btn){btn.classList.add('hit');setTimeout(()=>btn.classList.remove('hit'),120);}
}
function startCine(f){
  cine={f,t:0,dur:1.05};camFocus=f;
  const el=$('cine');el.style.setProperty('--c',f.css);$('cineName').textContent=f.ultName;$('cineTh').textContent=f.ultTh;el.hidden=false;
  flashSprite(wpos(f.segs[0]),f.auraC,5,glowTex,.6);
}
function endCine(){const f=cine.f;cine=null;$('cine').hidden=true;f.state='ult';f.t=0;f.dur=ULTDUR[f.id];f.hitDone=false;f.hits=0;f.grabbed=false;}
function heal(f,n,quiet){if(f.state==='ko')return;f.hp=Math.min(f.maxHp,f.hp+n);renderHP();if(!quiet){riseCrosses(wpos(f.segs[0]),0x7dffd8,14);label(f,'HEAL +'+n);}}
function damage(target,amt,from,o){
  o=o||{};
  if(over||target.state==='ko')return;
  if(target.dodge&&!o.ult&&!['held','ult','ultcharge'].includes(target.state)&&Math.random()<target.dodge){
    const p=wpos(target.segs[0]);boltLine(p.clone().add(V3(0,1,0)),p.clone().add(V3(0,-1,0)),0xbfefff,.25,.4);flashSprite(p,target.auraC,1.6,glowTex);
    target.dodgeT=.38;label(target,'MISS!');return;
  }
  let d=amt*from.dmgMul*(from.buffT>0?1.3:1);
  if(target.shieldT>0)d*=.4;
  d=Math.max(1,Math.round(d));
  target.hp-=d;target.flash=1;
  const armored=target.armor&&['punch','tail','special'].includes(target.state)&&!o.ult;
  const busy=['ult','ultcharge','held'].includes(target.state);
  if(!armored&&!busy){target.state='hit';target.t=0;target.dur=.45;}
  if(armored)label(target,'ARMOR!');
  if(!o.ult)from.sup=Math.min(100,from.sup+d*1.6);
  target.sup=Math.min(100,target.sup+d*1.0);
  if(from.burn&&!o.noBurn)target.burnT=3;
  shake=Math.max(shake,o.ult?.7:(d>12?.5:.28));
  from.combo=from.comboT>0?from.combo+1:1;from.comboT=1.3;if(from.combo>=2)label(from,from.combo+' HITS');
  const p=wpos(target.segs[0],.1);p.x-=target.dir*.2;
  flashSprite(p,0xffffff,d>12?2.6:1.6);flashSprite(p,from.auraC,d>12?3.4:2.2,glowTex);burst(p,from.burn?0xff7a1f:from.auraC,d>12?120:60,d>12?6:4);
  renderHP();if(target.hp<=0)ko(target,from);
}
function ko(loser,winner){
  if(over)return;
  over=true;loser.state='ko';loser.t=0;winner.state='win';winner.t=0;winner.whipOn=false;slowmo=.3;slowT=1.1;shake=.8;
  announce('K.O.','show ko');const tok=matchToken;
  setTimeout(()=>{if(over&&tok===matchToken){announce(winner.name+' WINS','stay');$('btn-rematch').classList.add('hot');}},2300);
}
function timeOver(){
  over=true;const [a,b]=P;const ra=a.hp/a.maxHp,rb=b.hp/b.maxHp;
  if(Math.abs(ra-rb)<.001){announce('DRAW','stay');a.state=b.state='idle';}
  else{const w=ra>rb?a:b;w.state='win';w.t=0;w.opp.state='idle';announce(w.name+' WINS','stay');}
  $('btn-rematch').classList.add('hot');

function resetMatch(){

/* ---------- moves ---------- */
function setArms(A,v){A.forEach(a=>Object.assign(a,v));}
function mixArms(A,G,t){A.forEach((a,i)=>{const g=G[i];a.x=lerp(a.x,g.x,t);a.z=lerp(a.z,g.z,t);a.ex=lerp(a.ex,g.ex,t);a.ez=lerp(a.ez,g.ez,t);});}
function drawWhip(f,time,targetPos){
  const a=wpos(f.head,.5);const b=targetPos||wpos(f.opp.segs[0],.05);
  const e=f.whipExt;const end=a.clone().lerp(b,e);const pts=[];
  for(let i=0;i<=12;i++){const t=i/12;const p=a.clone().lerp(end,t);p.y+=Math.sin(t*Math.PI)*.55*(1-e*.7)+Math.sin(t*14-time*22)*.06*(1-t*.4);p.z+=Math.sin(t*9+time*15)*.05;pts.push(p);}
  f.whip.geometry.dispose();f.whip.geometry=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),48,.032,6,false);f.whip.visible=true;
  if(Math.random()<.5)burst(end,0xff7a1f,5,1.2,.07);
}

/* ---------- posing ---------- */
const tmpC=new THREE.Color();
function pose(f,dt,time){
  if(f.slowT>0)dt*=.5;
  f.t+=dt;
  const s=Math.sin(time*3.6+f.phase);
  const p=f.dur?Math.min(1,f.t/f.dur):0;
  const muscle=f.kind==='muscle';
  const T=f.opp;
  let bob=s*.07,tX=.05,tY=0,headX=0,lunge=0,curl=0,spin=0,power=0,jumpY=0,scaleK=1,ov=null,whip=false;
  const G=f.guard.map(a=>Object.assign({},a));
  const A=f.guard.map(a=>Object.assign({},a));
  switch(f.state){
    case 'punch':
      if(f.id==='thunder'){const k=Math.min(2,Math.floor(p*3));const fr=p*3-k;const e=Math.sin(Math.PI*clamp(fr,0,1));const a=A[k%2?0:1];
        a.x=lerp(a.x,-1.55,e);a.ex=lerp(a.ex,-.05,e);a.z=lerp(a.z,.1,e);lunge=.55;tY=(k%2?-.3:.3)*e;tX=.2;
        if(f.hits<=k&&fr>=.45){f.hits=k+1;damage(T,4,f);}}
      else{const e=envl(p,.28,.12);const a=A[1];a.x=lerp(a.x,-1.58,e);a.ex=lerp(a.ex,-.04,e);a.z=lerp(a.z,.08,e);A[0].ex=lerp(A[0].ex,-2.2,e);tY=.45*e;tX=.05+.25*e;lunge=.6*e;
        if(!f.hitDone&&p>=.3){f.hitDone=true;damage(T,BASE.punch.dmg,f);}}
      break;
    case 'tail':{const e=envl(p,.38,.12);spin=eio(Math.min(1,p/.8))*Math.PI*2;curl=-.22*e;lunge=.5*e;tX=-.25*e;A.forEach(a=>{a.z+=.7*e;a.x+=.3*e;});
      if(!f.hitDone&&p>=.5){f.hitDone=true;damage(T,BASE.tail.dmg,f);} break;}
    case 'special':
      if(f.id==='emerald'){
        if(p<.45){const c=eo(p/.45);setArms(A,{x:lerp(-.7,-2.7,c),ex:lerp(-1.9,-.4,c),z:.3});bob+=.15*c;tX=-.15*c;power=c;}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];p.age+=dt;p.obj.position.x+=p.dir*p.speed*dt;
    if(p.obj.userData.tor){p.obj.userData.tor.rotation.x+=dt*12;}
    if(p.kind==='wave'){p.spikeT-=dt;if(p.spikeT<=0){p.spikeT=.045;spikeAt(p.obj.position.x+(Math.random()-.5)*.2,(Math.random()-.5)*.7);}}
    const tx=p.target.root.position.x;const reached=p.dir>0?p.obj.position.x>=tx-.4:p.obj.position.x<=tx+.4;
    if(reached&&p.target.state!=='ko'&&!over){
      damage(p.target,p.dmg,p.owner,p.opts);if(p.onHit)p.onHit(p.target);
      burst(p.obj.position.clone().setY(Math.max(.4,p.obj.position.y)),p.owner.auraC,p.kind==='wave'?120:90,6);
      world.remove(p.obj);disposeObj(p.obj);projectiles.splice(i,1);}
    else if(Math.abs(p.obj.position.x)>9||p.age>3){world.remove(p.obj);disposeObj(p.obj);projectiles.splice(i,1);}
  }
}
function updateFx(dt){
  for(let i=fx.length-1;i>=0;i--){
    const e=fx[i];e.age+=dt;const k=clamp(e.age/e.life,0,1);
    if(e.kind==='burst'){const a=e.obj.geometry.attributes.position.array;for(let j=0;j<e.v.length;j+=3){a[j]+=e.v[j]*dt;a[j+1]+=e.v[j+1]*dt;a[j+2]+=e.v[j+2]*dt;e.v[j]*=.95;e.v[j+1]=e.v[j+1]*.95-3*dt;e.v[j+2]*=.95;}e.obj.geometry.attributes.position.needsUpdate=true;e.obj.material.opacity=1-k;}
    else if(e.kind==='flash'){const sc=e.size*(.4+eo(k));e.obj.scale.set(sc,sc,1);e.obj.material.opacity=1-k;}
    else if(e.kind==='rise'){if(e.age>0){e.obj.position.y+=dt*1.2;e.obj.material.opacity=1-k;}else e.obj.material.opacity=0;}
    else if(e.kind==='spike'){const h=k<.2?eo(k/.2):1-(k-.2)/.8;e.obj.scale.set(e.big,Math.max(.01,h)*e.big,e.big);e.obj.position.y=.3*h*e.big-.05;}
    else if(e.kind==='ring'){const sc=1+eo(k)*e.size;e.obj.scale.set(sc,sc,1);e.obj.material.opacity=1-k;}
    else if(e.kind==='line'){e.obj.material.opacity=(1-k)*(Math.random()<.7?1:.3);}
    if(e.age>=e.life){world.remove(e.obj);if(e.kind!=='spike')disposeObj(e.obj);fx.splice(i,1);}
  }
}

  updateFx(dt);
  if(mode==='fight'){hudTick();if(started&&!over&&!cine){timerAcc+=dt;if(timerAcc>=1){timerAcc-=1;timer--;$('timer').textContent=String(timer);if(timer<=0)timeOver();}}}
  const da=dust.geometry.attributes.position.array;for(let i=1;i<da.length;i+=3){da[i]+=dt*.12;if(da[i]>6)da[i]=0;}dust.geometry.attributes.position.needsUpdate=true;
  shake=Math.max(0,shake-dt*1.8);
  if(shake>0&&!reduceMotion)world.position.set((Math.random()-.5)*shake*.25,(Math.random()-.5)*shake*.18,0);else world.position.set(0,0,0);
  controls.update();
  zoomK+=((cine?1:0)-zoomK)*Math.min(1,raw*5);
  if(zoomK>.01&&camFocus){
    const focus=wpos(camFocus.segs[0]);savedPos.copy(camera.position);savedQ.copy(camera.quaternion);
    camera.position.lerp(focus,.42*zoomK);lookV.copy(controls.target).lerp(focus,zoomK);camera.lookAt(lookV);
    if(composer)composer.render();else renderer.render(scene,camera);
    camera.position.copy(savedPos);camera.quaternion.copy(savedQ);
  }else{if(composer)composer.render();else renderer.render(scene,camera);}
}
frame();
})();
